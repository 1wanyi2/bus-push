name: 公交到站推送

on:
  schedule:
    - cron: '8 0 * * *'
    - cron: '18 0 * * *'
  workflow_dispatch:
    inputs:
      discover:
        description: '设为 1 进入 ID 发现模式'
        required: false
        default: ''

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: 安装 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 关键新增：配置国内 npm 镜像，解决网络不通的问题
      - name: 配置 npm 镜像源
        run: npm config set registry https://registry.npmmirror.com

      - name: 安装 Python 依赖
        run: pip install -r requirements.txt
        
      - name: 运行主脚本
        env:
          QQ_EMAIL: ${{ secrets.QQ_EMAIL }}
          QQ_AUTH_CODE: ${{ secrets.QQ_AUTH_CODE }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          DISCOVER: ${{ github.event.inputs.discover }}
        run: python main.py
